[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papersmith-ai"
dynamic = ["version"]
description = "CLI workspace orchestrator for the papersmith-ai scientific paper engineering framework"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Laboratorio de Inteligencia Artificial UNAL", email = "amalvarezme@unal.edu.co" },
]
keywords = ["research", "academic-writing", "latex", "literature-review", "agents", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  # No `License ::` classifier here on purpose: PEP 639 superseded them by the
  # SPDX `license` expression above, and setuptools refuses a build that
  # carries both.
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: LaTeX",
]

# Deliberately empty, and it has to stay that way. `smith init` provisions
# the environment the framework actually runs in -- see scripts/setup_env.py --
# so the installed CLI stays a 2 MB tool that cannot conflict with anything
# already in a user's environment. A dependency added here is a dependency
# every `pipx install` pays for before the user has a workspace.
dependencies = []

[project.urls]
Homepage = "https://github.com/LIAUNAL/papersmith-ai"
Repository = "https://github.com/LIAUNAL/papersmith-ai"
Changelog = "https://github.com/LIAUNAL/papersmith-ai/blob/main/CHANGELOG.md"
Issues = "https://github.com/LIAUNAL/papersmith-ai/issues"

[project.scripts]
# `smith` is the only command. The `papersmith` alias (0.19.0-0.68.x) was
# removed; `smith upgrade` repoints workspace MCP entries that still launch it.
smith = "papersmith.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["papersmith*"]

[tool.setuptools.package-data]
papersmith = [
  "templates/*.tpl",
  "_kit/**/*",
  "_kit/.claude/agents/*.md",
  "_kit/guidance/paper-guide/.gitkeep",
  "_kit/skills/kaggle-accounts/store/.gitignore",
]

[tool.setuptools.dynamic]
version = {attr = "papersmith.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".*",
  "build",
  "dist",
  "node_modules",
  "skills",
  "src/papersmith/_kit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]


